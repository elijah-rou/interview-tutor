[package]
name = "practice-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "practice"
path = "src/main.rs"

[[bin]]
name = "interview-tutor"
path = "src/bin/interview-tutor.rs"

[dependencies]
crossterm = { version = "0.28", default-features = false, features = ["events"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
nix = { version = "0.30", default-features = false, features = ["signal"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vte = { version = "0.15", default-features = false }
unicode-width = "=0.2.0"
unicode-segmentation = "1.12"
