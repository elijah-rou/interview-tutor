[package]
name = "practice-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "practice"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
nix = { version = "0.30", features = ["process", "signal"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.4"
vte = "0.15"
