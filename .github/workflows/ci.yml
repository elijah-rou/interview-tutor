name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TERM: xterm-256color
      RUSTFLAGS: -Dwarnings
      INTERVIEW_TUTOR_CODEX_EXECUTABLE: ${{ github.workspace }}/cli/tests/fixtures/fake_codex_app_server.py
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check --no-compile ruff==0.14.10

      - name: Restore Cargo download cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-downloads-${{ hashFiles('**/Cargo.lock') }}

      - name: Fetch locked dependencies
        run: |
          cargo fetch --manifest-path cli/Cargo.toml --locked
          cargo fetch --manifest-path rust/Cargo.toml --locked

      - name: Check
        env:
          CARGO_NET_OFFLINE: "true"
        run: make check

      - name: Test harness self-tests
        env:
          CARGO_NET_OFFLINE: "true"
        run: make test-harness

      - name: Test serial PTY matrix
        env:
          CARGO_NET_OFFLINE: "true"
        run: make test-pty

      - name: Test cancellation races
        env:
          CARGO_NET_OFFLINE: "true"
        run: make test-race

      - name: Check release binaries
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo check --manifest-path cli/Cargo.toml --bins --release --locked --offline
