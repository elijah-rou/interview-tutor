[project]
name = "local-practice-python"
version = "0.1.0"
description = "Dependency-free local problem execution framework"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"problems/**/*.py" = ["F821"] # Judge-supplied ListNode, TreeNode, and Node.
